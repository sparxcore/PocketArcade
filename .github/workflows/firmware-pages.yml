name: Build firmware installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional installer version label (defaults to PROJECT_VER)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate board profiles
        run: python3 tools/board_profiles.py validate

      - name: Build board firmware
        run: /opt/esp/entrypoint.sh python3 tools/board_profiles.py build-all

      - name: Package installer
        env:
          INSTALLER_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INSTALLER_VERSION}" ]; then
            python3 tools/board_profiles.py package \
              --output dist/pages \
              --version "${INSTALLER_VERSION}" \
              --include-provisional
          else
            python3 tools/board_profiles.py package \
              --output dist/pages \
              --include-provisional
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
